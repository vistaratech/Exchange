<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d3e" />
      <stop offset="50%" stop-color="#0f372d" />
      <stop offset="100%" stop-color="#08221b" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="warmAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="120" fill="url(#appBg)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Central Exchange Icon Group -->
  <g filter="url(#shadow)" transform="translate(64, 64) scale(0.75)">
    <!-- Top Arrow (Moving Right) -->
    <g transform="translate(0, 40)">
      <path d="M 60,110 L 340,110" stroke="url(#accentGlow)" stroke-width="44" stroke-linecap="round" />
      <path d="M 280,50 L 370,110 L 280,170" fill="none" stroke="url(#accentGlow)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Bottom Arrow (Moving Left) -->
    <g transform="translate(0, 190)">
      <path d="M 452,170 L 172,170" stroke="#f4ede2" stroke-width="44" stroke-linecap="round" />
      <path d="M 232,110 L 142,170 L 232,230" fill="none" stroke="#f4ede2" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Center decorative node dot -->
    <circle cx="256" cy="205" r="20" fill="url(#warmAccent)" />
  </g>
</svg>
